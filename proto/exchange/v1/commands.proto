syntax = "proto3";
package exchange.v1;

enum Side      { SIDE_UNSPECIFIED = 0;       SIDE_BUY = 1;         SIDE_SELL = 2; }
enum OrderType { ORDER_TYPE_UNSPECIFIED = 0; ORDER_TYPE_LIMIT = 1; ORDER_TYPE_MARKET = 2; }

message Order {
  uint64    id       = 1;
  uint64    owner_id = 2;
  Side      side     = 3;
  OrderType type     = 4;
  optional int64 price = 5;   // limit: required. market: must be absent.
  int64     quantity = 6;
}

message StopOrder {
  uint64 id = 1;  uint64 owner_id = 2;  Side side = 3;
  int64  stop_price = 4;  int64 quantity = 5;
  optional int64 limit_price = 6;  // absent = stop-market
}

message NewOrder    { Order order = 1; }
message CancelOrder { uint64 requester = 1; uint64 order_id = 2; }
message ModifyOrder { uint64 requester = 1; uint64 order_id = 2; int64 new_price = 3; int64 new_quantity = 4; }
message PlaceStop   { StopOrder stop = 1; }
message CancelStop  { uint64 requester = 1; uint64 order_id = 2; }
message ModifyStop  { uint64 requester = 1; uint64 order_id = 2; int64 new_stop_price = 3;
                      optional int64 new_limit_price = 4; int64 new_quantity = 5; }

message CommandBody {
  oneof body {
    NewOrder    new_order    = 1;
    CancelOrder cancel_order = 2;
    ModifyOrder modify_order = 3;
    PlaceStop   place_stop   = 4;
    CancelStop  cancel_stop  = 5;
    ModifyStop  modify_stop  = 6;
  }
}
